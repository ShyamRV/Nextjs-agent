[project]
name = "nextjs-sandbox-agent"
version = "0.1.0"
description = "Autonomous uAgents backend: generate Next.js + Tailwind apps in a sandbox, build, self-heal, preview, and publish to GitHub."
requires-python = ">=3.11"
dependencies = [
  "uagents>=0.24.0",
  "uagents-core>=0.4.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "langchain>=1.2.10",
  "langchain-openai>=1.1.10",
  "langgraph>=1.0.10",
  "e2b>=2.20.0",
  # Optional Postgres checkpointer (install if DATABASE_URL is set):
  # "langgraph-checkpoint-postgres>=3.0.4",
  # "psycopg[binary]>=3.3.3",
  # "psycopg-pool>=3.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
